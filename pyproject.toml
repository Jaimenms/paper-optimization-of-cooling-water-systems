[project]
name = "coolingnet"
version = "0.1.0"
description = "Optimization of cooling water system hydraulic debottlenecking (Souza, Levy & Costa, Applied Thermal Engineering 128, 2018) - Python reimplementation"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "MIT" }
authors = [{ name = "Jaime N. M. Souza" }]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pandas>=2.1",
    "pydantic>=2.5",
    "pyyaml>=6.0",
    "pyomo>=6.8",
    "pyscipopt>=5.1",
    "matplotlib>=3.8",
    "networkx>=3.2",
    "typer>=0.12",
    "rich>=13.0",
    "pillow>=10.0",
    "tabulate>=0.9",
    "casadi>=3.6",
]

[project.optional-dependencies]
notebooks = [
    "jupyterlab>=4.0",
    "ipykernel>=6.29",
    "ipywidgets>=8.1",
    "nbformat>=5.10",
    "nbclient>=0.10",
    "nbconvert>=7.16",
    "papermill>=2.6",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.scripts]
coolingnet = "coolingnet.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/coolingnet"]

[tool.ruff]
line-length = 140
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "W"]
per-file-ignores = { "src/coolingnet/cli.py" = ["B008"], "notebooks/_src/*" = ["E402", "B018", "F821"] }
ignore = ["N803", "N806", "N815", "N802", "E741", "E501"]  # scientific naming (T_w_in, NTU, ...), long formula lines

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: long-running optimization tests (deselect with -m 'not slow')",
]
addopts = "-ra"

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
